# Copies the older portfolio images from the devlonics.com media library into
# public/work and commits them, so the site stops depending on WordPress.
# Run it once from the Actions tab (or via the API) before moving the domain.
name: Sync portfolio images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-portfolio.mjs
      - name: Commit new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/work
          git diff --cached --quiet || git commit -m "Add portfolio images to the repo"
          git push
